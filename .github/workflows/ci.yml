name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-and-test:
    name: Build & test (all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Root build script orders workspaces correctly: shared -> client -> server.
      # client/server compile against shared/dist, which is gitignored.
      - name: Build all workspaces
        run: npm run build

      - name: Test all workspaces
        run: npm test
