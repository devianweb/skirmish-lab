name: Deploy to GitHub Pages

# Deploys are intentional: only pushes/merges to the `release` branch trigger
# this workflow. Merge `master` -> `release` when ready to demo.
on:
  push:
    branches: [release]

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a new push supersedes the old one.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & bundle client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Test all workspaces
        run: npm test

      # Rebuild the client with the deployed signaling server URL baked in.
      # VITE_SIGNALING_URL is a repo secret (e.g. wss://your-app.up.railway.app).
      # Unset locally -> SignalingClient falls back to ws://localhost:8080.
      - name: Build client for Pages
        run: npm run build --workspace=client
        env:
          VITE_SIGNALING_URL: ${{ secrets.VITE_SIGNALING_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
