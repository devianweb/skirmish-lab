name: Deploy to GitHub Pages

# Deploys are intentional: this workflow runs ONLY when a PR targeting the
# `release` branch is merged. Open a PR (`master` -> `release`) and merge it
# when ready to demo. Direct pushes to `release` do NOT deploy the client.
on:
  pull_request:
    branches: [release]
    types: [closed]

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a new merge supersedes the old one.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    # PRs closed without merging must not deploy.
    if: github.event.pull_request.merged == true
    name: Build, test & bundle client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The actual merge commit on `release`, not the PR's temporary merge ref.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Test all workspaces
        run: npm test

      # Rebuild the client with the deployed signaling server URL baked in.
      # VITE_SIGNALING_URL is a repo secret (e.g. wss://your-app.up.railway.app).
      # Unset locally -> SignalingClient falls back to ws://localhost:8080.
      - name: Build client for Pages
        run: npm run build --workspace=client
        env:
          VITE_SIGNALING_URL: ${{ secrets.VITE_SIGNALING_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
