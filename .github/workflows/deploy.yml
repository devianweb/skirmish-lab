name: Deploy to GitHub Pages & Azure App Service

# Deploys are intentional: runs on pushes to `release` (triggered by merging a PR into `release`).
on:
  push:
    branches: [release]

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a new push supersedes the old one.
concurrency:
  group: 'deploy-release'
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & package artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Test all workspaces
        run: npm test

      # Rebuild the client with the deployed signaling server URL baked in.
      # VITE_SIGNALING_URL is a repo secret (e.g. wss://<app>.azurewebsites.net).
      # Unset locally -> SignalingClient falls back to ws://localhost:8080.
      - name: Build client for Pages
        run: npm run build --workspace=client
        env:
          VITE_SIGNALING_URL: ${{ secrets.VITE_SIGNALING_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/dist

      # Package a self-contained signaling server bundle for Azure App Service.
      # Avoids monorepo workspace symlink issues by embedding shared/dist directly.
      - name: Stage signaling server deployment bundle
        run: |
          mkdir -p deploy-server/dist
          cp -r server/dist/* deploy-server/dist/
          cat << 'EOF' > deploy-server/package.json
          {
            "name": "skirmish-lab-signaling",
            "version": "1.0.0",
            "main": "dist/index.js",
            "scripts": {
              "start": "node dist/index.js"
            },
            "dependencies": {
              "ws": "^8.18.0"
            }
          }
          EOF
          cd deploy-server
          npm install --omit=dev --no-package-lock
          mkdir -p node_modules/@skirmish-lab/shared/dist
          cp ../shared/package.json node_modules/@skirmish-lab/shared/
          cp -r ../shared/dist/* node_modules/@skirmish-lab/shared/dist/
          cd ..

      - name: Upload Signaling Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: signaling-server
          path: ./deploy-server

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-server:
    name: Deploy to Azure App Service
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Signaling Server artifact
        uses: actions/download-artifact@v4
        with:
          name: signaling-server
          path: ./deploy-server

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME || 'skirmish-lab-signaling' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./deploy-server
